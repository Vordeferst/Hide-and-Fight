<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hide and Fight</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #060303;
    background-image:
      radial-gradient(ellipse at 50% 45%, #1a0406 0%, #080203 60%, #000 100%);
    font-family: 'Special Elite', 'Courier New', monospace;
    color: #b8a89a;
    padding: 16px;
    overflow-x: hidden;
  }

  /* Grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    opacity: .11;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 998;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,.35) 0px,
      rgba(0,0,0,.35) 1px,
      transparent 1px,
      transparent 4px
    );
    opacity: .5;
  }

  .game-wrap {
    width: 100%; max-width: 560px;
    min-height: 710px;
    background: #0a0505;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(90,10,15,.18) 0%, transparent 55%),
      linear-gradient(180deg, #0d0505 0%, #050202 100%);
    border: 1px solid #1e0a0c;
    border-radius: 2px;
    box-shadow:
      0 0 50px rgba(60,8,10,.4),
      0 40px 100px rgba(0,0,0,.95),
      inset 0 0 80px rgba(0,0,0,.9);
    padding: 26px 22px;
    position: relative;
    overflow: hidden;
  }

  .game-wrap::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 100px rgba(0,0,0,.95);
    border-radius: 2px;
    z-index: 3;
  }

  .version {
    position: absolute;
    right: 12px; bottom: 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #4a3630;
    text-transform: uppercase;
    font-weight: 700;
    z-index: 1001;
    pointer-events: none;
  }

  /* ---------- SCREENS ---------- */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 658px;
    gap: 16px;
    position: relative;
    z-index: 2;
  }
  .screen.active { display: flex; animation: fade .55s ease; }

  @keyframes fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  h1, h2 {
    font-family: 'Creepster', 'Impact', fantasy;
    font-weight: 400;
    letter-spacing: 2px;
  }
  h2 { font-size: 26px; }

  .sub {
    font-size: 11px; letter-spacing: 5px;
    color: #7a5f52;
    text-transform: uppercase;
  }
  .hint {
    font-size: 13px; line-height: 1.55;
    color: #7a6558;
    max-width: 360px;
  }

  /* ---------- BUTTONS ---------- */
  .btn {
    border: 1px solid #3a0e12;
    cursor: pointer;
    font: inherit; font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-size: 13px;
    padding: 15px 42px;
    background: #140508;
    color: #d8c0b0;
    border-radius: 2px;
    transition: .18s;
    position: relative;
  }
  .btn:hover {
    background: #20080c;
    border-color: #6a1018;
    color: #fff;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }

  .btn.primary {
    background: linear-gradient(180deg, #2a080c 0%, #140406 100%);
    border-color: #6a1018;
    color: #e8c8c8;
    text-shadow: 0 0 6px rgba(180,30,40,.4);
  }
  .btn.primary:hover {
    background: linear-gradient(180deg, #400c14 0%, #20060a 100%);
    box-shadow: 0 0 18px rgba(140,20,30,.4);
  }

  .btn.ghost {
    padding: 11px 24px;
    font-size: 11.5px;
    letter-spacing: 2px;
    background: transparent;
    border-color: #2a1018;
    color: #907878;
  }
  .btn.ghost:hover { color: #e8c8c8; border-color: #6a1018; background: #140508; }

  .btn.danger {
    background: linear-gradient(180deg, #4a0408 0%, #1e0204 100%);
    border: 1px solid #b01828;
    color: #f0c8cc;
    padding: 12px 28px;
    font-size: 12px;
    letter-spacing: 2.5px;
    box-shadow: 0 0 14px rgba(180,20,40,.3);
  }
  .btn.danger:hover {
    background: linear-gradient(180deg, #6a060c 0%, #2e0406 100%);
    box-shadow: 0 0 22px rgba(200,25,45,.55);
  }
  .btn.danger:disabled { opacity: .35; box-shadow: none; }

  /* ================= LOADING ================= */
  #screen-loading { gap: 26px; }

  .load-logo {
    width: 120px; height: 120px;
    filter: drop-shadow(0 0 18px rgba(140,15,25,.55));
    animation: loadPulse 2.2s ease-in-out infinite;
  }
  @keyframes loadPulse {
    0%,100% { transform: scale(1); opacity: .85; }
    50%     { transform: scale(1.06); opacity: 1; }
  }

  .load-bar {
    width: 78%; max-width: 320px; height: 4px;
    background: #1a0306;
    border: 1px solid #2a080c;
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .load-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #5a0810, #b01828, #5a0810);
    background-size: 200% 100%;
    animation: barFlow 1.4s linear infinite;
    transition: width .1s linear;
    box-shadow: 0 0 12px rgba(180,25,40,.6);
  }
  @keyframes barFlow {
    to { background-position: -200% 0; }
  }

  .load-status {
    font-size: 12px;
    color: #6a4a3a;
    letter-spacing: 3px;
    text-transform: uppercase;
    min-height: 16px;
  }

  /* Vordeferst reveal */
  .vordeferst {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 60px;
    letter-spacing: 6px;
    color: #b01828;
    text-shadow:
      1px 1px 0 #150305,
      2px 2px 0 #150305,
      0 0 34px rgba(180,25,40,.75),
      0 0 60px rgba(140,15,25,.5);
    opacity: 0;
    transform: scale(1.35);
    filter: blur(6px);
    transition: none;
    position: absolute;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    line-height: 1;
  }
  .vordeferst.show {
    animation: vordeReveal 2.6s ease-out forwards;
  }
  @keyframes vordeReveal {
    0%   { opacity: 0; transform: scale(1.35); filter: blur(6px); }
    18%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    70%  { opacity: 1; transform: scale(1);   filter: blur(0); }
    100% { opacity: 0; transform: scale(.9);  filter: blur(4px); }
  }

  /* ================= MENU ================= */
  #screen-menu { gap: 22px; }

  .logo { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }

  .logo-svg {
    width: 92px; height: 92px;
    filter: drop-shadow(0 0 14px rgba(100,10,20,.7));
    transition: filter .35s;
  }
  .logo-svg.scary {
    filter: drop-shadow(0 0 26px rgba(255,20,40,.9)) drop-shadow(0 0 50px rgba(180,10,25,.6));
    animation: scaryJitter .12s steps(2) infinite;
  }
  @keyframes scaryJitter {
    0%   { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(-1px, 1px) rotate(-1deg); }
    100% { transform: translate(1px, -1px) rotate(1deg); }
  }

  .title {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 54px;
    letter-spacing: 5px;
    color: #7a0a14;
    text-shadow:
      1px 1px 0 #150305,
      2px 2px 0 #150305,
      0 0 24px rgba(140,15,25,.5);
    line-height: 1;
    text-align: center;
  }

  .tagline {
    font-size: 11px; letter-spacing: 6px;
    color: #6a4a3a;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .stats-bar { display: flex; gap: 8px; }
  .stat-chip {
    display: flex; align-items: center; gap: 7px;
    background: #0a0304;
    border: 1px solid #2a080c;
    padding: 8px 14px;
    border-radius: 2px;
    font-size: 13px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .stat-chip svg { width: 16px; height: 16px; }
  .stat-chip.coins { color: #a88820; border-color: #3a2808; }
  .stat-chip.exp   { color: #906a90; border-color: #2e1a30; }
  .stat-chip .val { color: #d8c0b0; }

  .menu-buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  .menu-buttons .btn { width: 100%; }
  .menu-row { display: flex; gap: 10px; }
  .menu-row .btn { flex: 1; }

  /* ---------- SEARCH ---------- */
  .spinner {
    width: 70px; height: 70px;
    border-radius: 50%;
    border: 2px solid rgba(100,15,20,.18);
    border-top-color: #7a0a14;
    border-right-color: #a01828;
    animation: spin 1.4s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }

  /* ---------- VS ---------- */
  .vs-block {
    display: flex; align-items: center; justify-content: center;
    gap: 18px; width: 100%;
    margin: 4px 0;
  }
  .fighter { display: flex; flex-direction: column; align-items: center; gap: 9px; min-width: 108px; }

  .avatar-circle {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #150608 0%, #050202 85%);
    border: 1px solid #2a080c;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(0,0,0,.9);
    position: relative;
  }
  .avatar-circle svg { width: 88%; height: 88%; }
  .avatar-circle.me {
    border-color: #3a1018;
    box-shadow: inset 0 0 30px rgba(0,0,0,.9), 0 0 12px rgba(80,15,25,.3);
  }
  .avatar-circle.enemy {
    border-color: #4a0a14;
    box-shadow: inset 0 0 30px rgba(0,0,0,.9), 0 0 14px rgba(120,15,25,.35);
  }

  .fighter-nick {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 18px;
    letter-spacing: 2px;
    max-width: 130px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .fighter-nick.me { color: #b8a090; }
  .fighter-nick.enemy { color: #c8404e; }

  .vs-mark {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 32px;
    color: #7a0a14;
    text-shadow: 1px 1px 0 #150305;
    letter-spacing: 3px;
  }

  /* ---------- ROLE ---------- */
  .role-tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 11px 22px;
    background: #0a0304;
    border: 1px solid #3a0810;
    border-radius: 2px;
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 22px;
    letter-spacing: 3px;
    animation: pop .5s cubic-bezier(.2,1.2,.4,1);
  }
  .role-tag.hider  { color: #6ac888; border-color: #163a1e; }
  .role-tag.seeker { color: #d0404e; border-color: #4a0810; }
  .role-tag svg { width: 24px; height: 24px; }

  @keyframes pop {
    0%   { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ---------- GAME ---------- */
  #screen-game { justify-content: flex-start; gap: 14px; padding-top: 4px; }

  .hud {
    width: 100%;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 72px; justify-content: center;
  }
  #hud-opponent {
    font-size: 11px; letter-spacing: 3px;
    color: #6a4a3a;
    text-transform: uppercase;
  }
  #hud-opponent b { color: #c8404e; font-family: 'Creepster', fantasy; font-size: 15px; letter-spacing: 2px; font-weight: 400; }
  #hud-status { font-size: 15px; font-weight: 600; line-height: 1.4; color: #b8a89a; }

  .room { display: flex; gap: 8px; width: 100%; }

  .spot {
    flex: 1;
    background: linear-gradient(180deg, #120608 0%, #060203 100%);
    border: 1px solid #2a080c;
    border-radius: 2px;
    padding: 22px 4px 16px;
    cursor: pointer;
    color: #907878;
    font: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: .18s;
    user-select: none;
    position: relative;
  }
  .spot:hover {
    border-color: #6a1018;
    color: #e8c8c8;
    background: linear-gradient(180deg, #1e080c 0%, #0a0203 100%);
  }
  .spot:active { transform: scale(.98); }

  .spot svg { width: 36px; height: 36px; }
  .spot-name {
    font-size: 10px; letter-spacing: 1.2px;
    text-transform: uppercase;
    opacity: .75;
    line-height: 1.15;
  }

  .spot.checked {
    opacity: .2;
    filter: grayscale(1) brightness(.4);
    pointer-events: none;
  }
  .spot.me {
    border-color: #1a3a20;
    color: #6ac888;
    background: linear-gradient(180deg, #081408 0%, #040804 100%);
    box-shadow: inset 0 0 20px rgba(40,120,60,.15);
  }
  .spot.found {
    border-color: #b01828;
    color: #e8c0c4;
    background: linear-gradient(180deg, #200208 0%, #0a0103 100%);
    box-shadow: inset 0 0 24px rgba(140,20,35,.3);
    animation: shake .4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); }
    75% { transform: translateX(7px); }
  }

  .log {
    margin-top: auto;
    font-size: 12px;
    color: #7a6558;
    min-height: 18px;
    letter-spacing: .5px;
    font-style: italic;
  }

  .ability-bar {
    width: 100%;
    display: flex; justify-content: center;
  }

  /* ---------- RESULT ---------- */
  .result-icon {
    width: 118px; height: 118px;
    display: flex; align-items: center; justify-content: center;
    animation: pop .5s cubic-bezier(.2,1.2,.4,1);
  }
  .result-icon svg { width: 100%; height: 100%; }
  .result-icon.win  { color: #90b890; }
  .result-icon.lose { color: #b01828; }

  #result-title {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 42px;
    letter-spacing: 6px;
  }
  #result-title.win  { color: #6ac888; text-shadow: 1px 1px 0 #0a180c; }
  #result-title.lose { color: #b01828; text-shadow: 1px 1px 0 #150305; }

  .reward {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-top: 2px;
  }
  .reward-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: #0a0304;
    border: 1px solid #2a080c;
    border-radius: 2px;
    font-size: 13px; font-weight: 700;
    letter-spacing: 1px;
    animation: pop .5s cubic-bezier(.2,1.2,.4,1) backwards;
  }
  .reward-chip:nth-child(1) { animation-delay: .1s; }
  .reward-chip:nth-child(2) { animation-delay: .2s; }
  .reward-chip.coins { color: #a88820; border-color: #3a2808; }
  .reward-chip.exp   { color: #906a90; border-color: #2e1a30; }
  .reward-chip svg { width: 15px; height: 15px; }

  /* ================= SHOP / INVENTORY ================= */
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 10px;
  }
  .panel-head h2 {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 32px;
    letter-spacing: 3px;
    color: #7a0a14;
    text-shadow: 1px 1px 0 #150305;
  }

  .shop-grid {
    display: flex; flex-direction: column; gap: 12px;
    width: 100%; overflow-y: auto;
    padding: 2px;
    max-height: 480px;
  }
  .shop-grid::-webkit-scrollbar { width: 4px; }
  .shop-grid::-webkit-scrollbar-thumb { background: #3a0810; border-radius: 2px; }

  .hero-card {
    display: flex; gap: 14px; align-items: center;
    background: linear-gradient(135deg, #100406 0%, #050202 100%);
    border: 1px solid #2a080c;
    border-radius: 2px;
    padding: 14px;
    text-align: left;
    transition: .2s;
    position: relative;
    overflow: hidden;
  }
  .hero-card::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: #7a0a14;
  }
  .hero-card.owned::before { background: #4a8a5a; }
  .hero-card.active {
    border-color: #3a6a48;
    background: linear-gradient(135deg, #081408 0%, #040804 100%);
  }

  .hero-avatar {
    width: 82px; height: 82px; flex-shrink: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #150608 0%, #050202 85%);
    border: 1px solid #2a080c;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    box-shadow: inset 0 0 22px rgba(0,0,0,.9);
  }
  .hero-avatar svg { width: 92%; height: 92%; }

  .hero-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .hero-name {
    font-family: 'Creepster', 'Impact', fantasy;
    font-size: 22px;
    letter-spacing: 2px;
    color: #d0404e;
    line-height: 1;
  }
  .hero-role-tag {
    font-size: 10px; letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #7a6558;
  }
  .hero-role-tag.hider { color: #6ac888; }
  .hero-desc { font-size: 11.5px; color: #7a6558; line-height: 1.45; margin-top: 3px; }
  .hero-action { flex-shrink: 0; }
  .hero-action .btn { padding: 10px 16px; font-size: 11px; letter-spacing: 1.5px; }

  .price-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 14px; font-weight: 800; color: #a88820;
    letter-spacing: 1px;
  }
  .price-tag svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<div class="game-wrap" id="game-wrap">

  <!-- ===== LOADING ===== -->
  <section class="screen active" id="screen-loading">
    <div class="load-logo" id="load-logo"></div>
    <div class="load-bar"><div class="load-bar-fill" id="load-fill"></div></div>
    <p class="load-status" id="load-status">Booting…</p>
    <div class="vordeferst" id="vordeferst">Vordeferst</div>
  </section>

  <!-- ===== MENU ===== -->
  <section class="screen" id="screen-menu">
    <div class="logo">
      <div class="logo-svg" id="logo-icon"></div>
      <div class="title">HIDE and FIGHT</div>
      <p class="tagline">— survive or die —</p>
    </div>

    <div class="stats-bar">
      <div class="stat-chip coins">
        <span id="coin-icon"></span>
        <span class="val" id="stat-coins">0</span>
      </div>
      <div class="stat-chip exp">
        <span id="exp-icon"></span>
        <span class="val" id="stat-exp">0.0</span>
        <span style="opacity:.5; font-weight:600;">XP</span>
      </div>
    </div>

    <div class="menu-buttons">
      <button class="btn primary" id="btn-play">▶ PLAY</button>
      <div class="menu-row">
        <button class="btn ghost" id="btn-shop">SHOP</button>
        <button class="btn ghost" id="btn-inventory">INVENTORY</button>
      </div>
    </div>
  </section>

  <!-- ===== SEARCH ===== -->
  <section class="screen" id="screen-search">
    <div class="spinner"></div>
    <h2 style="color:#7a0a14; text-shadow:1px 1px 0 #150305;">Searching for opponent<span class="dots"></span></h2>
    <p class="hint" style="opacity:.35;">Someone is already on your trail…</p>
  </section>

  <!-- ===== VS + ROLE ===== -->
  <section class="screen" id="screen-role">
    <p class="sub" style="letter-spacing:6px; color:#6a4a3a;">OPPONENT FOUND</p>

    <div class="vs-block">
      <div class="fighter">
        <div class="avatar-circle me" id="vs-my-avatar"></div>
        <div class="fighter-nick me" id="vs-my-nick">—</div>
      </div>
      <div class="vs-mark">VS</div>
      <div class="fighter">
        <div class="avatar-circle enemy" id="vs-enemy-avatar"></div>
        <div class="fighter-nick enemy" id="vs-enemy-nick">—</div>
      </div>
    </div>

    <div class="role-tag" id="role-tag"></div>
    <p class="hint" id="role-desc"></p>
  </section>

  <!-- ===== GAME ===== -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div id="hud-opponent"></div>
      <div id="hud-status">—</div>
    </div>

    <div class="ability-bar" id="ability-bar" style="display:none;">
      <button class="btn danger" id="btn-shoot">SHOOT · 40%</button>
    </div>

    <div class="room" id="room"></div>
    <div class="log" id="log"></div>
  </section>

  <!-- ===== RESULT ===== -->

    if (raw) {
      const p = JSON.parse(raw);
      stats.coins = Number(p.coins) || 0;
      stats.exp   = Number(p.exp) || 0;
      stats.owned = Array.isArray(p.owned) && p.owned.length ? p.owned : ['default'];
      stats.active = stats.owned.includes(p.active) ? p.active : stats.owned[0];
    }
  } catch (e) {}
}

  try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ============================================================

   ============================================================ */
async function runLoading() {
  const fill = document.getElementById('load-fill');
  const vord = document.getElementById('vordeferst');
  const status = document.getElementById('load-status');
  const messages = [
    'Booting…',
    'Waking the dark…',
    'Sharpening blades…',
    'Dimming the lights…',
    'Hiding in shadows…',
    'Ready.'
  ];

  const total = 6000;   // total loading time
  const start = Date.now();
  let lastIdx = -1;
  let vordShown = false;

  await new Promise((resolve) => {
    const iv = setInterval(() => {
      const elapsed = Date.now() - start;
      const p = Math.min(1, elapsed / total);
      fill.style.width = (p * 100).toFixed(1) + '%';

      const idx = Math.min(messages.length - 1, Math.floor(p * messages.length));
      if (idx !== lastIdx) {
        lastIdx = idx;
        status.textContent = messages[idx];
      }

      // Reveal "Vordeferst" mid-loading
      if (p > 0.42 && !vordShown) {
        vordShown = true;
        vord.classList.add('show');
      }

      if (p >= 1) { clearInterval(iv); resolve(); }
    }, 40);
  });

  // Small pause after bar completes
  await sleep(700);
  showScreen('screen-menu');
  startScaryLogoLoop();
}

    el.classList.remove('scary');

}

function startScaryLogoLoop() {
  const tick = () => {
    const delay = randInt(7000, 16000);
    setTimeout(() => {
      if (document.getElementById('screen-menu').classList.contains('active')) {
        triggerScaryLogo();

      tick();

  };
  tick();
}

    const el = document.createElement('button');
    el.className = 'spot';
    el.innerHTML = `<span>${ICONS[spot.key]}</span><span class="spot-name">${spot.name}</span>`;
    el.addEventListener('click', () => onClick(i, el));
    room.appendChild(el);
  });
}
function spotEl(i) { return document.querySelectorAll('.spot')[i]; }

/* ============================================================
   SHOP
   ============================================================ */
function renderShop() {
  const grid = $('#shop-grid');
  grid.innerHTML = '';
  SHOP_ORDER.forEach((id) => {
    const hero = HEROES[id];
    const owned = stats.owned.includes(id);
    const canBuy = stats.coins >= hero.price;

    const card = document.createElement('div');
    card.className = 'hero-card' + (owned ? ' owned' : '');
    card.innerHTML = `
      <div class="hero-avatar">${hero.avatar}</div>
      <div class="hero-info">
        <div class="hero-name">${hero.name}</div>
        <div class="hero-role-tag ${hero.roleKey === 'hider' ? 'hider' : ''}">${hero.role}</div>
        <div class="hero-desc">${hero.desc}</div>
      </div>
      <div class="hero-action"></div>
    `;
    const action = card.querySelector('.hero-action');
    if (owned) {
      const tag = document.createElement('div');
      tag.style.cssText = 'font-size:11px; color:#6ac888; font-weight:800; letter-spacing:1.5px;';
      tag.textContent = 'OWNED';
      action.appendChild(tag);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn primary';
      btn.disabled = !canBuy;
      btn.innerHTML = `<span class="price-tag">${ICONS.coin} ${hero.price}</span>`;
      btn.addEventListener('click', () => buyHero(id));
      action.appendChild(btn);
    }
    grid.appendChild(card);
  });
}

function buyHero(id) {
  const hero = HEROES[id];
  if (stats.owned.includes(id)) return;
  if (stats.coins < hero.price) return;
  stats.coins -= hero.price;
  stats.owned.push(id);
  stats.active = id;
  saveStats();
  updateStatsUI();
  renderShop();
  renderInventory();
}

/* ============================================================
   INVENTORY
   ============================================================ */
function renderInventory() {
  const grid = $('#inv-grid');
  grid.innerHTML = '';
  stats.owned.forEach((id) => {
    const hero = HEROES[id];
    if (!hero) return;
    const active = stats.active === id;

    const card = document.createElement('div');
    card.className = 'hero-card owned' + (active ? ' active' : '');
    card.innerHTML = `
      <div class="hero-avatar">${hero.avatar}</div>
      <div class="hero-info">
        <div class="hero-name">${hero.name}</div>
        <div class="hero-role-tag ${hero.roleKey === 'hider' ? 'hider' : ''}">${hero.role}</div>
        <div class="hero-desc">${hero.desc}</div>
      </div>
      <div class="hero-action"></div>
    `;
    const action = card.querySelector('.hero-action');
    if (active) {
      const tag = document.createElement('div');
      tag.style.cssText = 'font-size:11px; color:#6ac888; font-weight:800; letter-spacing:1.5px;';
      tag.textContent = '✓ EQUIPPED';
      action.appendChild(tag);
    } else {
      const btn = document.createElement('button');
      btn.className = 'btn ghost';
      btn.textContent = 'EQUIP';
      btn.style.padding = '10px 14px';
      btn.style.fontSize = '11px';
      btn.addEventListener('click', () => {
        stats.active = id;
        saveStats();
        renderInventory();
        renderShop();
      });
      action.appendChild(btn);
    }
    grid.appendChild(card);
  });
}

/* ============================================================
   1. MATCHMAKING (13–49 sec)
   ============================================================ */
async function startMatchmaking() {
  showScreen('screen-search');
  game.opponent = randomNickname();
  game.opponentChar = ENEMY_CHARACTERS[Math.floor(Math.random() * ENEMY_CHARACTERS.length)];

  const duration = randInt(13000, 49000);
  await sleep(duration);

  rollRole();
}

/* ============================================================
   2. VS + ROLE
   ============================================================ */
function rollRole() {
  clearTimeout(roleTimeout);

  const role = Math.random() < SEEKER_CHANCE ? 'seeker' : 'hider';
  game.role = role;

  const hero = getActiveHero();

  $('#vs-my-avatar').innerHTML = hero.avatar;
  $('#vs-my-nick').textContent = hero.name;
  $('#vs-enemy-avatar').innerHTML = game.opponentChar.avatar;
  $('#vs-enemy-nick').textContent = game.opponentChar.name;

  const tag = $('#role-tag');
  tag.classList.remove('hider', 'seeker');
  if (role === 'hider') {
    tag.classList.add('hider');
    tag.innerHTML = `${ICONS.hider}<span>YOU HIDE</span>`;
    $('#role-desc').textContent =
      `It will search only 2 of the 4 spots. Pick wisely — if found, you die.` +
      (hero.ability === 'shot' ? ' Or shoot first.' : '');
  } else {
    tag.classList.add('seeker');
    tag.innerHTML = `${ICONS.seeker}<span>YOU SEEK</span>`;
    $('#role-desc').textContent =
      `It hides in one of the four spots. You may check only 2. If you miss — it escapes.`;
  }

  showScreen('screen-role');

  roleTimeout = setTimeout(() => {
    if ($('#screen-role').classList.contains('active')) startRound();
  }, 2600);
}

/* ============================================================
   3. ROUND START
   ============================================================ */
async function startRound() {
  const token = ++roundToken;
  const hero = getActiveHero();

  game.mySpot = null;
  game.hiderSpot = randInt(0, SPOTS.length - 1);
  game.checksLeft = PLAYER_CHECKS;
  game.over = false;
  game.locked = true;
  game.shotUsed = false;

  showScreen('screen-game');
  renderRoom(onSpotClick);
  setLog('');
  $('#hud-opponent').innerHTML = `${game.opponentChar.name} · <b>${game.opponent}</b>`;

  const abilityBar = $('#ability-bar');
  if (role_has_shot(hero)) {
    abilityBar.style.display = 'flex';
    $('#btn-shoot').disabled = true;
    $('#btn-shoot').textContent = `SHOOT · ${Math.round(SHOT_CHANCE*100)}%`;
  } else {
    abilityBar.style.display = 'none';
  }

  if (game.role === 'hider') {
    setStatus('Pick a hiding spot. It is already close…');
    game.locked = false;
  } else {
    setStatus('It hides somewhere in the room…');
    await sleep(randInt(4000, 9000));
    if (token !== roundToken) return;
    setStatus(`Search! Attempts left: ${game.checksLeft} of ${SPOTS.length}`);
    game.locked = false;
  }
}

function role_has_shot(hero) { return game.role === 'hider' && hero.ability === 'shot'; }

/* ============================================================
   4. SPOT CLICK
   ============================================================ */
function onSpotClick(index, el) {
  if (game.locked || game.over) return;
  if (el.classList.contains('checked')) return;

  if (game.role === 'hider') {
    game.mySpot = index;
    game.locked = true;
    el.classList.add('me');
    setStatus('You are hidden. Hold your breath…');
    setLog('Footsteps are getting closer…');

    const hero = getActiveHero();
    if (hero.ability === 'shot') $('#btn-shoot').disabled = false;

    seekerTurn(roundToken);

  } else {
    game.checksLeft--;
    if (index === game.hiderSpot) {
      el.classList.add('found');
      game.locked = true;
      setLog(`You found it. ${game.opponent} was here.`);
      endGame(true, 'seeker', `You dragged ${game.opponent} out of hiding.`);
    } else {
      el.classList.add('checked');
      if (game.checksLeft <= 0) {
        game.locked = true;
        spotEl(game.hiderSpot).classList.add('found');
        setLog('Empty. It was not here…');
        endGame(false, 'seeker', `${game.opponent} survived the search. You lost it.`);
      } else {
        setStatus(`Empty. Attempts left: ${game.checksLeft} of ${SPOTS.length}`);
      }
    }
  }
}

/* ============================================================
   5. SHOT
   ============================================================ */
function useShot() {
  if (game.over || game.shotUsed) return;
  const hero = getActiveHero();
  if (!role_has_shot(hero)) return;

  game.shotUsed = true;
  $('#btn-shoot').disabled = true;

  setLog('You raise your rifle…');
  setStatus('Shot fired!');

  const success = Math.random() < SHOT_CHANCE;

  setTimeout(() => {
    if (success) {
      endGame(true, 'hider', `Clean shot. ${game.opponent} is not moving anymore.`);
    } else {
      game.locked = true;
      setLog('Missed. It heard the shot.');
      setTimeout(() => endGame(false, 'hider', `Missed. ${game.opponent} found you by the sound.`), 900);
    }
  }, 700);
}

/* ============================================================
   6. BOT SEEKER TURN
   ============================================================ */
async function seekerTurn(token) {
  const order = shuffle([0, 1, 2, 3]).slice(0, BOT_CHECKS);

  for (const idx of order) {
    await sleep(randInt(900, 1500));
    if (token !== roundToken || game.over) return;

    const el = spotEl(idx);
    el.classList.add('checked');
    setLog(`${game.opponent} checks: ${SPOTS[idx].name}…`);
    await sleep(450);
    if (token !== roundToken || game.over) return;

    if (idx === game.mySpot) {
      el.classList.add('found');
      setLog(`It found you in the ${SPOTS[idx].name}!`);
      endGame(false, 'hider', `${game.opponent} dragged you out of hiding.`);
      return;
    }
  }

  if (game.over) return;
  spotEl(game.mySpot).classList.add('me');
  setLog('Footsteps faded. It left.');
  endGame(true, 'hider', 'You survived the search and stayed alive.');
}

/* ============================================================
   7. END
   ============================================================ */
function endGame(win, role, text, customIcon) {
  game.over = true;
  game.locked = true;
  $('#btn-shoot').disabled = true;

  setTimeout(() => {
    const icon = $('#result-icon');
    icon.classList.remove('win', 'lose');
    icon.classList.add(win ? 'win' : 'lose');
    icon.innerHTML = win ? (customIcon || ICONS.trophy) : ICONS.skull;

    const title = $('#result-title');
    title.classList.remove('win', 'lose');
    title.classList.add(win ? 'win' : 'lose');
    title.textContent = win ? 'SURVIVED' : 'DEAD';
    $('#result-desc').textContent = text;

    const rewardBox = $('#reward-box');
    rewardBox.innerHTML = '';

    if (win) {
      const r = role === 'hider' ? REWARDS.hiderWin : REWARDS.seekerWin;
      addReward(r.coins, r.exp);
      rewardBox.innerHTML = `
        <div class="reward-chip coins">${ICONS.coin}<span>+${r.coins}</span></div>
        <div class="reward-chip exp">${ICONS.star}<span>+${r.exp.toFixed(1)} XP</span></div>
      `;
    } else {
      rewardBox.innerHTML = `<div style="opacity:.4; font-size:12px; letter-spacing:2px;">NOTHING</div>`;
    }

    showScreen('screen-result');
  }, 1100);
}

/* ============================================================
   INIT
   ============================================================ */
$('#logo-icon').innerHTML = ICONS.logo;
document.getElementById('load-logo').innerHTML = ICONS.logo;
$('#coin-icon').innerHTML = ICONS.coin;
$('#exp-icon').innerHTML  = ICONS.star;
$('#shop-coin-icon').innerHTML = ICONS.coin;

loadStats();
updateStatsUI();
renderShop();
renderInventory();

// Kick off loading sequence (starts before the menu shows)
runLoading();

/* ============================================================
   HANDLERS
   ============================================================ */
$('#btn-play').addEventListener('click', startMatchmaking);

$('#btn-shop').addEventListener('click', () => {
  updateStatsUI(); renderShop(); showScreen('screen-shop');
});
$('#btn-shop-back').addEventListener('click', () => showScreen('screen-menu'));

$('#btn-inventory').addEventListener('click', () => {
  renderInventory(); showScreen('screen-inventory');
});
$('#btn-inv-back').addEventListener('click', () => showScreen('screen-menu'));

$('#btn-shoot').addEventListener('click', useShot);

$('#btn-again').addEventListener('click', () => {
  roundToken++; clearTimeout(roleTimeout); startMatchmaking();
});

$('#btn-menu').addEventListener('click', () => {
  roundToken++; clearTimeout(roleTimeout); showScreen('screen-menu');
});
</script>
